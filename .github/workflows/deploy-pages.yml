name: Deploy to GitHub Pages

# This publishes a static PREVIEW build. The admin panel (/admin) won't work
# here — it depends on the local Vite dev server's content API, which has no
# equivalent on a static host. The public site itself works fine; it uses
# whatever was last saved to content.json (falling back to the defaults
# baked into the bundle if content.json doesn't exist).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /TRS_Website/

      # GitHub Pages has no server-side router: write index.html at every
      # route (so /join etc. answer 200 on a direct visit) plus a 404.html
      # fallback. react-router then takes over client-side.
      - run: node scripts/spa-routes.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
