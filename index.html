<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TRS BVM — The Robotics Society, BVM Engineering College. A student-driven robotics and engineering society designing, building and competing with robots." />
    <title>TRS BVM — The Robotics Society</title>
    <meta name="theme-color" content="#0a1628" />

    <!-- Link previews (WhatsApp, LinkedIn, Facebook, X). The values below are
         rewritten per page, with absolute URLs, by scripts/spa-routes.mjs
         when the site is built. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TRS BVM — The Robotics Society" />
    <meta property="og:title" content="TRS BVM — The Robotics Society" />
    <meta property="og:description" content="TRS BVM is the robotics club of BVM Engineering College, Vallabh Vidyanagar — competing at national and international robotics competitions." />
    <meta property="og:image" content="/brand/og-card.png" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TRS BVM — The Robotics Society" />
    <meta name="twitter:description" content="TRS BVM is the robotics club of BVM Engineering College, Vallabh Vidyanagar — competing at national and international robotics competitions." />
    <meta name="twitter:image" content="/brand/og-card.png" />

    <script>
      // Applied before first paint so there's no flash of the wrong theme.
      // Mirrors the logic in src/lib/ThemeContext.jsx.
      (function () {
        try {
          var saved = localStorage.getItem("trs-theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
